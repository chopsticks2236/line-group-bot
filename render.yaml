# Render.com 用（Blueprint）
# https://dashboard.render.com でこのリポジトリを接続してデプロイ

services:
  - type: web
    name: line-kameko-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: TZ
        value: Asia/Tokyo
      - key: INTERNAL_SCHEDULER_ENABLED
        value: "1"
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_GROUP_ID
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_VECTOR_STORE_ID
        sync: false
      - key: ADMIN_LINE_USER_ID
        sync: false

