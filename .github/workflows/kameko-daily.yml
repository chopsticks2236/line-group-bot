name: Kameko daily schedule

on:
  schedule:
    # 00:10 UTC = 09:10 JST
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render scheduler
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not configured in GitHub Secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            "https://line-group-bot-r3yl.onrender.com/cron/daily"
