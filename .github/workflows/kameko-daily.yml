name: Kameko daily schedule

on:
  schedule:
    # GitHub's scheduler may delay or thin high-frequency cron jobs. Start
    # several low-frequency runners shortly before each configured JST time;
    # the first one that starts stays alive until the exact minute, while the
    # endpoint's idempotency guard prevents duplicate LINE messages.
    # Shift request: 09:00 / 09:15 / 09:30 JST on the 15th.
    - cron: "0,15,30 0 15 * *"
    # Month-end payslip: 17:15 / 17:30 / 17:45 JST every day. Non-month-end
    # runs exit after the schedule check.
    - cron: "15,30,45 8 * * *"
    # Contract update: 15:45 / 16:00 / 16:15 JST on the 10th. Inactive months
    # exit after the schedule check.
    - cron: "45 6 10 * *"
    - cron: "0,15 7 10 * *"
  workflow_dispatch:
    inputs:
      date:
        description: "テスト日付（YYYY-MM-DD）。通常運用は空欄"
        required: false
        type: string
      force:
        description: "送済みでも再送する"
        required: false
        default: false
        type: boolean
      time:
        description: "テスト時刻（HH:MM）。通常運用は空欄"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kameko-daily-schedule
  cancel-in-progress: false

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out schedule configuration
        uses: actions/checkout@v4

      - name: Calculate exact-time wait plan
        id: wait-plan
        run: python bot/schedule_wait.py >> "$GITHUB_OUTPUT"

      - name: Trigger Render scheduler
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATE_INPUT: ${{ inputs.date }}
          FORCE_INPUT: ${{ inputs.force }}
          TIME_INPUT: ${{ inputs.time }}
          WAIT_REQUIRED: ${{ steps.wait-plan.outputs.wait_required }}
          TARGET_EPOCH: ${{ steps.wait-plan.outputs.target_epoch }}
          TARGET_TIME: ${{ steps.wait-plan.outputs.target_time }}
          SCHEDULE_IDS: ${{ steps.wait-plan.outputs.schedule_ids }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not configured in GitHub Secrets."
            exit 1
          fi

          BASE_URL="https://line-group-bot-r3yl.onrender.com"
          ENDPOINT="${BASE_URL}/cron/daily"
          CURL_ARGS=()

          if [ -n "${DATE_INPUT}" ]; then
            CURL_ARGS+=(--data-urlencode "date=${DATE_INPUT}")
          fi
          if [ "${FORCE_INPUT}" = "true" ]; then
            CURL_ARGS+=(--data-urlencode "force=1")
          fi
          if [ -n "${TIME_INPUT}" ]; then
            CURL_ARGS+=(--data-urlencode "time=${TIME_INPUT}")
          fi

          call_scheduler() {
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 10 \
              --connect-timeout 20 --max-time 180 --get "${CURL_ARGS[@]}" \
              -H "X-Cron-Secret: ${CRON_SECRET}" "${ENDPOINT}"
            echo
          }

          # 手動実行、対象日ではない日、時刻後に開始した実行は即時確認する。
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ] || [ "${WAIT_REQUIRED}" != "true" ]; then
            call_scheduler
            exit 0
          fi

          echo "Keeping this job alive for ${SCHEDULE_IDS} at ${TARGET_TIME}."

          # 時刻前の確認失敗だけでは終了しない。指定時刻の本番呼び出しで再試行する。
          call_scheduler || echo "Pre-target check failed; the exact-time call will retry."

          WAKE_LEAD_SECONDS=120
          NOW_EPOCH="$(date +%s)"
          SECONDS_TO_WAKE=$((TARGET_EPOCH - NOW_EPOCH - WAKE_LEAD_SECONDS))
          if [ "${SECONDS_TO_WAKE}" -gt 0 ]; then
            sleep "${SECONDS_TO_WAKE}"
          fi

          # Render無料版の休止復帰を送信時刻より前に済ませる。
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 10 \
            --connect-timeout 20 --max-time 150 "${BASE_URL}/" >/dev/null \
            || echo "Warm-up request failed; scheduler call will still retry."

          NOW_EPOCH="$(date +%s)"
          SECONDS_TO_TARGET=$((TARGET_EPOCH - NOW_EPOCH))
          if [ "${SECONDS_TO_TARGET}" -gt 0 ]; then
            sleep "${SECONDS_TO_TARGET}"
          fi

          echo "Calling scheduler at the configured time: ${TARGET_TIME}."
          call_scheduler
