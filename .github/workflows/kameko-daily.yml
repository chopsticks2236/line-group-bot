name: Kameko daily schedule

on:
  schedule:
    # Check every 5 minutes; Render sends only due, unsent messages.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "テスト日付（YYYY-MM-DD）。通常運用は空欄"
        required: false
        type: string
      force:
        description: "送済みでも再送する"
        required: false
        default: false
        type: boolean
      time:
        description: "テスト時刻（HH:MM）。通常運用は空欄"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kameko-daily-schedule
  cancel-in-progress: false

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render scheduler
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATE_INPUT: ${{ inputs.date }}
          FORCE_INPUT: ${{ inputs.force }}
          TIME_INPUT: ${{ inputs.time }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not configured in GitHub Secrets."
            exit 1
          fi

          ENDPOINT="https://line-group-bot-r3yl.onrender.com/cron/daily"
          CURL_ARGS=()

          if [ -n "${DATE_INPUT}" ]; then
            CURL_ARGS+=(--data-urlencode "date=${DATE_INPUT}")
          fi
          if [ "${FORCE_INPUT}" = "true" ]; then
            CURL_ARGS+=(--data-urlencode "force=1")
          fi
          if [ -n "${TIME_INPUT}" ]; then
            CURL_ARGS+=(--data-urlencode "time=${TIME_INPUT}")
          fi

          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 --max-time 180 --get "${CURL_ARGS[@]}" -H "X-Cron-Secret: ${CRON_SECRET}" "${ENDPOINT}"
