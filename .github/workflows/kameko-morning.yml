name: Kameko morning digest

on:
  schedule:
    # JST 04:17 / 05:17 / 06:17: reserve a runner well before 07:00.
    # The first available runner waits locally; Render wakes only at 06:57.
    # This cushions scheduler delays but cannot guarantee an exact delivery time.
    - cron: "17 19-21 * * *"
    # JST 06:47 / 07:13 / 08:13: delayed-start / outage recovery.
    - cron: "47 21 * * *"
    - cron: "13 22,23 * * *"
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "3回の接続・本文検証（LINEには送信しない）"
        type: boolean
        default: true
      date:
        description: "診断対象日 YYYY-MM-DD（空欄は当日）"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: kameko-morning-digest
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
      - name: Warm Render and run morning digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DIAGNOSTIC: ${{ inputs.diagnostic || 'false' }}
          TEST_DATE: ${{ inputs.date }}
          MORNING_SEND_TIME: "07:00"
          MORNING_CUTOFF_TIME: "06:45"
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: python -m bot.morning_trigger
