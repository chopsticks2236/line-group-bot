name: Kameko morning digest

on:
  schedule:
    # JST 01:37, then 02:07/02:37 through 06:07/06:37. GitHub's
    # scheduler has recently started jobs several hours late. Reserve
    # earlier, within the six-hour job limit; only the first runner waits.
    # The first available runner waits locally;
    # Render wakes only at 06:57.
    # This cushions scheduler delays but cannot guarantee an exact delivery time.
    - cron: "37 16 * * *"
    - cron: "7,37 17-21 * * *"
    # JST 07:13 / 08:13 / 09:13: delayed-start / outage recovery.
    - cron: "13 22,23,0 * * *"
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "3回の接続・本文検証（LINEには送信しない）"
        type: boolean
        default: true
      date:
        description: "診断対象日 YYYY-MM-DD（空欄は当日）"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: kameko-morning-digest
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Warm Render and run morning digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DIAGNOSTIC: ${{ inputs.diagnostic || 'false' }}
          TEST_DATE: ${{ inputs.date }}
          MORNING_SEND_TIME: "07:00"
          MORNING_CUTOFF_TIME: "06:45"
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: python -m bot.morning_trigger
