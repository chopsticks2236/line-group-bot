name: Kameko delivery validation (no send)

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'app.py'
      - 'test_*.py'
      - '.github/workflows/kameko-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kameko-delivery-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pyyaml
      - name: Offline regression tests
        env:
          INTERNAL_SCHEDULER_ENABLED: '0'
          LINE_CHANNEL_ACCESS_TOKEN: ''
          LINE_CHANNEL_SECRET: ''
        run: python -m unittest discover -v
      - name: Three production dependency checks (GET only, no LINE delivery)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DIAGNOSTIC: 'true'
        run: python -m bot.morning_trigger
